# >>> omarchy-handsfree >>>
bindd = SUPER ALT, V, Hands-free: listen for a command, exec, @BIN@/handsfree-ctl listen
bindd = SUPER SHIFT ALT, V, Hands-free: toggle continuous listening, exec, @BIN@/handsfree-ctl voice toggle
bindd = SUPER ALT, E, Hands-free: toggle eye tracking, exec, @BIN@/handsfree-ctl gaze toggle
bindd = SUPER ALT, M, Hands-free: mouse grid, exec, @BIN@/handsfree-ctl grid
# <<< omarchy-handsfree <<<
