# Default settings for omarchy-handsfree.
# Override any of them in ~/.config/handsfree/config.toml.

[desktop]
# Opens URLs in the default browser (use ["xdg-open"] outside Omarchy).
url_opener = ["omarchy-launch-browser"]
# Launches .desktop entries the same way Omarchy's launcher does.
app_launcher = ["uwsm", "app", "--"]
# Show what was heard and done as desktop notifications (notify-send).
notify = true
# RTMIN+N signal that refreshes the Waybar module; 0 disables.
waybar_signal = 9
# Wheel clicks per "scroll up/down".
scroll_steps = 5
# Add a space after each dictated phrase so sentences run on.
dictation_trailing_space = true

[voice]
# faster-whisper model: tiny.en (fastest), base.en, small.en (most accurate).
model = "base.en"
# Models are only loaded from the local cache, so nothing touches the network
# at runtime. Set true to let a newly configured model download on first use.
allow_download = false
device = "auto"          # auto | cpu | cuda
compute_type = "int8"    # int8 suits CPUs; CUDA switches to float16
language = "en"
# Empty = system default. A sounddevice name/index, or "pulse:<source>" to pin
# one PipeWire/Pulse source by name (see `pactl list short sources`).
input_device = ""
sample_rate = 16000
energy_threshold = 0.012 # raise it in a noisy room
silence_ms = 700         # pause that ends a command
max_utterance_ms = 12000
start_timeout_ms = 5000  # push-to-talk gives up after this much silence
fuzzy_threshold = 82     # 0-100; how loosely phrases may match
preload = true           # load Whisper at startup (if the mic is allowed) so the first command is fast
# Continuous mode only: wait for this openWakeWord model before each command
# ("hey_jarvis", "alexa", "hey_mycroft"; install with ./install.sh --with-wake).
# Empty = every sentence you say is treated as a command.
wake_word = ""
wake_threshold = 0.5
# Words Whisper reliably gets wrong, fixed before matching (whole words,
# any case). It often drops the O of Omarchy.
corrections = { "o marchy" = "Omarchy", "marchy" = "Omarchy", "omarchi" = "Omarchy", "neo vim" = "Neovim", "fast fetch" = "fastfetch" }
# Primes Whisper with the words you use most.
prompt = "Omarchy, Hyprland, Neovim, btop, fastfetch. Open browser. Open Google. Open Claude Code. Open Neovim. Run fastfetch. Search for. Type. Click. Right click. Scroll down. Workspace two. Show grid. Next theme."

[gaze]
camera = "auto"          # "auto", a V4L2 index, or a path such as "/dev/video0"
width = 640
height = 480
fps = 30
model = ""               # empty = ~/.local/share/omarchy-handsfree/models/face_landmarker.task
calibration_points = 9   # 9 (3x3) or 16 (4x4, more accurate, takes longer)
# One Euro smoothing: lower min_cutoff = steadier pointer, higher beta = snappier.
min_cutoff = 0.4
beta = 0.001
# Click by holding your gaze still for this long; 0 = off (try 900).
dwell_ms = 0
dwell_radius_px = 50
# Click with a deliberate blink of at least this long; 0 = off (try 600).
blink_click_ms = 0
# Mouse grid: n x n cells, first shown this big around your gaze (or the whole
# screen without gaze); zooming stops once cells would be smaller than grid_min_px.
grid_size = 3
grid_span_px = 420
grid_min_px = 24
# The overlay runs under the system Python with gtk4-layer-shell preloaded.
overlay_python = "/usr/bin/python3"
layer_shell_lib = "/usr/lib/libgtk4-layer-shell.so"
