# Voice commands for omarchy-handsfree.
#
# Add your own in ~/.config/handsfree/commands.toml using the same format.
# Your commands are tried before these defaults; set `replace_defaults = true`
# there to drop the defaults entirely. [sites] entries are merged.
#
# Phrases match case-insensitively with punctuation ignored. Slots:
#   {text}  any words              {n}    a number ("two" or "2")
#   {site}  a name from [sites]    {app}  an installed app (.desktop entry)
#   {key}   a key combo ("control l", "enter")
#   {command}  a shell command, lowercased ("run fastfetch")
#
# Each command has exactly one action:
#   run       shell command; slot values are shell-quoted
#   url       URL opened in the default browser; {text} is URL-encoded
#   app       launch the application matched by {app}
#   hypr      arguments for `hyprctl dispatch`
#   type      text typed into the focused window
#   key       key combo pressed on the virtual keyboard
#   mouse     click | double_click | right_click | middle_click | mouse_down |
#             mouse_up | scroll_up | scroll_down | scroll_left | scroll_right
#   internal  a handsfree control (voice_on, dictation_on, gaze_on, grid, ...)
#
# In dictation mode everything you say is typed, except commands marked
# `dictation = true`, which still run when matched exactly.

[sites]
google = "https://www.google.com"
youtube = "https://www.youtube.com"
github = "https://github.com"
claude = "https://claude.ai"
chatgpt = "https://chatgpt.com"
gmail = "https://mail.google.com"
"arch wiki" = "https://wiki.archlinux.org"
"omarchy manual" = "https://learn.omacom.io/2/the-omarchy-manual"

# -- Apps ---------------------------------------------------------------------

[[command]]
say = ["open browser", "open the browser", "launch browser", "new browser window"]
run = "omarchy-launch-browser"

# Whisper sometimes hears "Claude" as "cloud"; both are accepted.
[[command]]
say = ["open claude code", "launch claude code", "start claude code", "open cloud code"]
run = "omarchy-launch-terminal claude"

[[command]]
say = ["open terminal", "open a terminal", "new terminal"]
run = "omarchy-launch-terminal"

[[command]]
say = ["open neovim", "open vim", "open nvim", "open editor", "open the editor"]
run = "omarchy-launch-editor"

[[command]]
say = ["open activity monitor", "open task manager", "open system monitor", "open btop", "show processes"]
run = "omarchy-launch-or-focus-tui btop"

# -- Themes -------------------------------------------------------------------

[[command]]
say = ["next theme", "change theme", "change the theme", "switch theme", "new theme"]
run = '''cur=$(omarchy-theme-current); next=$(omarchy-theme-list | awk -v c="$cur" 'f { print; exit } $0 == c { f = 1 }'); omarchy-theme-set "${next:-$(omarchy-theme-list | head -n 1)}"'''

[[command]]
say = ["theme {text}", "switch to {text} theme", "use {text} theme", "set theme {text}", "change theme to {text}"]
run = '''omarchy-theme-set "$(omarchy-theme-list | grep -ix -- {text} || omarchy-theme-list | grep -i -m 1 -- {text})"'''

[[command]]
say = ["open {site}", "go to {site}", "show me {site}"]
url = "{site}"

[[command]]
say = ["open {app}", "launch {app}", "start {app}"]
app = "{app}"

# -- Search -------------------------------------------------------------------

[[command]]
say = ["search youtube for {text}", "youtube search {text}"]
url = "https://www.youtube.com/results?search_query={text}"

[[command]]
say = ["search for {text}", "search {text}", "google {text}", "look up {text}"]
url = "https://www.google.com/search?q={text}"

# -- Windows and workspaces ---------------------------------------------------

[[command]]
say = ["close window", "close this window", "close it"]
hypr = "killactive"

[[command]]
say = ["fullscreen", "full screen", "toggle fullscreen"]
hypr = "fullscreen 0"

[[command]]
say = ["float window", "toggle floating"]
hypr = "togglefloating"

[[command]]
say = ["workspace {n}", "go to workspace {n}", "switch to workspace {n}"]
hypr = "workspace {n}"

[[command]]
say = ["move to workspace {n}", "move window to workspace {n}"]
hypr = "movetoworkspace {n}"

[[command]]
say = ["next workspace"]
hypr = "workspace e+1"

[[command]]
say = ["previous workspace"]
hypr = "workspace e-1"

[[command]]
say = ["focus left"]
hypr = "movefocus l"

[[command]]
say = ["focus right"]
hypr = "movefocus r"

[[command]]
say = ["focus up"]
hypr = "movefocus u"

[[command]]
say = ["focus down"]
hypr = "movefocus d"

# -- Typing and keys ----------------------------------------------------------

[[command]]
say = ["type {text}", "write {text}"]
type = "{text}"

[[command]]
say = ["press {key}", "hit {key}"]
key = "{key}"

# Types the command into the focused window (a terminal) and presses Enter.
[[command]]
say = ["run {command}", "execute {command}"]
type = "{command}\n"

[[command]]
say = ["new line", "press enter"]
key = "enter"
dictation = true

[[command]]
say = ["undo"]
key = "ctrl z"

[[command]]
say = ["redo"]
key = "ctrl shift z"

[[command]]
say = ["copy", "copy that"]
key = "ctrl c"

[[command]]
say = ["paste", "paste that"]
key = "ctrl v"

[[command]]
say = ["select all"]
key = "ctrl a"

[[command]]
say = ["save", "save file"]
key = "ctrl s"

[[command]]
say = ["new tab"]
key = "ctrl t"

[[command]]
say = ["close tab"]
key = "ctrl w"

[[command]]
say = ["go back"]
key = "alt left"

[[command]]
say = ["go forward"]
key = "alt right"

[[command]]
say = ["reload", "refresh", "reload page"]
key = "ctrl r"

[[command]]
say = ["address bar", "focus address bar"]
key = "ctrl l"

# -- Mouse (acts at the pointer, which gaze or the grid can move) -------------

[[command]]
say = ["click", "left click", "click it", "click that"]
mouse = "click"

[[command]]
say = ["double click"]
mouse = "double_click"

[[command]]
say = ["right click"]
mouse = "right_click"

[[command]]
say = ["middle click"]
mouse = "middle_click"

[[command]]
say = ["scroll down", "page down"]
mouse = "scroll_down"

[[command]]
say = ["scroll up", "page up"]
mouse = "scroll_up"

[[command]]
say = ["scroll to bottom", "scroll to the bottom", "go to bottom", "go to the bottom"]
key = "end"

[[command]]
say = ["scroll to top", "scroll to the top", "go to top", "go to the top"]
key = "home"

[[command]]
say = ["scroll left"]
mouse = "scroll_left"

[[command]]
say = ["scroll right"]
mouse = "scroll_right"

[[command]]
say = ["hold click", "mouse down", "start drag"]
mouse = "mouse_down"

[[command]]
say = ["release", "release click", "drop", "mouse up"]
mouse = "mouse_up"

# -- Handsfree itself ---------------------------------------------------------

[[command]]
say = ["stop listening", "go to sleep", "voice off"]
internal = "voice_off"
dictation = true

[[command]]
say = ["start listening", "keep listening", "voice on"]
internal = "voice_on"

[[command]]
say = ["start eye tracking", "eye tracking on", "eyes on", "gaze on", "track my eyes"]
internal = "gaze_on"

[[command]]
say = ["stop eye tracking", "eye tracking off", "eyes off", "gaze off"]
internal = "gaze_off"

[[command]]
say = ["calibrate", "calibrate eyes", "calibrate eye tracking"]
internal = "calibrate"

[[command]]
say = ["grid", "show grid", "mouse grid"]
internal = "grid"

# While the grid is open, a number zooms into that cell and moves the pointer.
[[command]]
say = ["{n}", "number {n}", "pick {n}"]
internal = "grid_pick"

[[command]]
say = ["close grid", "hide grid", "cancel"]
internal = "grid_close"

[[command]]
say = ["start dictation", "dictation on", "dictation mode"]
internal = "dictation_on"

[[command]]
say = ["stop dictation", "dictation off", "end dictation"]
internal = "dictation_off"
dictation = true
